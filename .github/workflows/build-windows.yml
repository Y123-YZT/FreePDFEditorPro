name: Build Windows EXE and Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: FreePDFEditor-PortableInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: FreePDFEditor-PortableInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name FreePDFEditorPro app/main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        working-directory: FreePDFEditor-PortableInstaller
        run: |
          iscc installer\FreePDFEditorPro.iss

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "FreePDFEditor-PortableInstaller\dist\FreePDFEditorPro\*" `
            -DestinationPath "FreePDFEditorPro-Portable.zip"

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: FreePDFEditorPro-Windows
          path: |
            FreePDFEditor-PortableInstaller\installer\output\FreePDFEditorPro-Setup.exe
            FreePDFEditorPro-Portable.zip
